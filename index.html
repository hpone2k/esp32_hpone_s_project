<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 LED Control</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;600&display=swap');
  :root { --on:#00ffaa; --bg:#0a0a0f; --panel:#11111c; --border:#1e1e32; --text:#c8c8e0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); font-family:'Rajdhani',sans-serif; color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:40px; overflow:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(0,255,170,0.03) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(0,255,170,0.03) 1px,transparent 1px);
    background-size:40px 40px; pointer-events:none;
  }
  h1 { font-family:'Share Tech Mono',monospace; font-size:clamp(1rem,3vw,1.3rem); letter-spacing:0.3em; color:rgba(200,200,224,0.4); text-transform:uppercase; }

  .bulb-wrap { display:flex; flex-direction:column; align-items:center; gap:24px; }
  .bulb {
    width:160px; height:160px; border-radius:50%; border:2px solid var(--border);
    background:var(--panel); position:relative; transition:all 0.4s cubic-bezier(0.23,1,0.32,1);
    display:flex; align-items:center; justify-content:center;
  }
  .bulb::before { content:''; width:80px; height:80px; border-radius:50%; background:#1a1a2e; transition:all 0.4s cubic-bezier(0.23,1,0.32,1); }
  .bulb.on { border-color:var(--on); box-shadow:0 0 30px rgba(0,255,170,0.4),0 0 80px rgba(0,255,170,0.2),0 0 160px rgba(0,255,170,0.1),inset 0 0 40px rgba(0,255,170,0.15); }
  .bulb.on::before { background:var(--on); box-shadow:0 0 20px rgba(0,255,170,0.8),0 0 60px rgba(0,255,170,0.4); }
  .bulb.on::after { content:''; position:absolute; inset:-12px; border-radius:50%; border:1px solid rgba(0,255,170,0.3); animation:pulse 2s ease-out infinite; }
  @keyframes pulse { 0%{transform:scale(1);opacity:0.6} 100%{transform:scale(1.3);opacity:0} }

  .status { font-family:'Share Tech Mono',monospace; font-size:2rem; letter-spacing:0.2em; transition:color 0.4s ease; }
  .status.on { color:var(--on); } .status.off { color:rgba(200,200,224,0.25); }

  .controls { display:flex; gap:16px; }
  .btn {
    font-family:'Share Tech Mono',monospace; font-size:0.8rem; letter-spacing:0.2em;
    padding:12px 28px; border-radius:4px; cursor:pointer; text-transform:uppercase;
    transition:all 0.2s ease; border:1px solid;
  }
  .btn-on  { background:rgba(0,255,170,0.08); border-color:rgba(0,255,170,0.4); color:var(--on); }
  .btn-on:hover  { background:rgba(0,255,170,0.18); box-shadow:0 0 16px rgba(0,255,170,0.25); }
  .btn-off { background:rgba(200,200,224,0.05); border-color:rgba(200,200,224,0.2); color:rgba(200,200,224,0.5); }
  .btn-off:hover { background:rgba(200,200,224,0.1); border-color:rgba(200,200,224,0.4); color:rgba(200,200,224,0.8); }
  .btn:active { transform:scale(0.96); }
  .btn:disabled { opacity:0.3; cursor:not-allowed; }

  .conn-bar { display:flex; align-items:center; gap:10px; font-family:'Share Tech Mono',monospace; font-size:0.75rem; letter-spacing:0.15em; color:rgba(200,200,224,0.3); }
  .dot { width:8px; height:8px; border-radius:50%; background:#333; transition:background 0.3s,box-shadow 0.3s; }
  .dot.connected { background:var(--on); box-shadow:0 0 8px rgba(0,255,170,0.8); animation:blink 2s ease-in-out infinite; }
  .dot.disconnected { background:#ff4466; }
  .dot.connecting { background:#ffaa00; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .hint { font-size:0.8rem; letter-spacing:0.1em; color:rgba(200,200,224,0.2); text-transform:uppercase; }
</style>
</head>
<body>
<h1>ESP32 &nbsp;/&nbsp; LED Control</h1>

<div class="bulb-wrap">
  <div class="bulb" id="bulb"></div>
  <div class="status off" id="statusText">---</div>
</div>

<div class="controls">
  <button class="btn btn-on"  id="btnOn"  onclick="send('ON')"  disabled>Turn ON</button>
  <button class="btn btn-off" id="btnOff" onclick="send('OFF')" disabled>Turn OFF</button>
</div>

<div class="conn-bar">
  <div class="dot connecting" id="dot"></div>
  <span id="connLabel">CONNECTING TO BROKER...</span>
</div>
<p class="hint">Control from here or press the physical button</p>

<script>
  const TOPIC_STATE   = 'hpone_esp32_001/led/state';
  const TOPIC_COMMAND = 'hpone_esp32_001/led/command';

  const bulb       = document.getElementById('bulb');
  const statusText = document.getElementById('statusText');
  const dot        = document.getElementById('dot');
  const connLabel  = document.getElementById('connLabel');
  const btnOn      = document.getElementById('btnOn');
  const btnOff     = document.getElementById('btnOff');

  // Connect to HiveMQ via WebSocket
  const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
    clientId: 'web_hpone_' + Math.random().toString(16).slice(2, 8),
    clean: true
  });

  client.on('connect', () => {
    dot.className = 'dot connected';
    connLabel.textContent = 'CONNECTED · HiveMQ';
    btnOn.disabled = false;
    btnOff.disabled = false;
    client.subscribe(TOPIC_STATE);
  });

  client.on('offline', () => {
    dot.className = 'dot disconnected';
    connLabel.textContent = 'DISCONNECTED';
    btnOn.disabled = true;
    btnOff.disabled = true;
  });

  client.on('message', (topic, message) => {
    const state = message.toString().trim();
    if (state === 'ON') {
      bulb.className = 'bulb on';
      statusText.textContent = 'ON';
      statusText.className = 'status on';
    } else if (state === 'OFF') {
      bulb.className = 'bulb';
      statusText.textContent = 'OFF';
      statusText.className = 'status off';
    }
  });

  function send(cmd) {
    if (client.connected) client.publish(TOPIC_COMMAND, cmd);
  }
</script>
</body>
</html>
